<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Nassim Ayadi — Software Engineer</title>
<meta name="description" content="Nassim Ayadi — Full-Stack &amp; DevOps Software Engineer. CI/CD, Kubernetes, HashiCorp Vault, robotics tooling." />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%23070A0F'/%3E%3Ctext x='50' y='68' font-size='56' font-family='monospace' fill='%2335D8C0' text-anchor='middle'%3EN%3C/text%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="scroll-progress" id="scrollProgress"></div>

<div class="bg-fx" aria-hidden="true">
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="grid-overlay"></div>
</div>

<header class="nav">
  <div class="nav-inner">
    <a href="#hero" class="nav-logo">N<span class="accent">.</span>A</a>
    <nav class="nav-links" id="navLinks"></nav>
    <div class="nav-actions">
      <button class="lang-toggle" id="langToggle" type="button" aria-label="Switch language">
        <span class="lang-opt" data-lang="en">EN</span>
        <span class="lang-sep">/</span>
        <span class="lang-opt" data-lang="fr">FR</span>
      </button>
      <button class="nav-burger" id="navBurger" type="button" aria-label="Toggle menu" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
    </div>
  </div>
</header>

<main>

  <section id="hero" class="hero">
    <div class="hero-inner">
      <h1 class="hero-name">Nassim Ayadi</h1>
      <p class="hero-role">
        <span class="typewriter" id="typewriter"></span><span class="caret" aria-hidden="true"></span>
      </p>
      <p class="hero-pitch" id="heroPitch"></p>
      <div class="hero-actions" id="heroActions"></div>
      <div class="hero-meta" id="heroMeta"></div>
    </div>
    <div class="hero-photo-wrap">
      <div class="hero-photo-frame">
        <img src="assets/headshot.png" alt="Portrait of Nassim Ayadi" class="hero-photo" />
      </div>
      <div class="hero-photo-tag" id="heroPhotoTag"></div>
    </div>
    <a class="scroll-cue" href="#about" aria-label="Scroll to content">
      <span></span>
    </a>
  </section>

  <section id="about" class="section reveal">
    <div class="section-inner narrow">
      <p class="eyebrow" id="aboutEyebrow"></p>
      <p class="about-text" id="aboutText"></p>
    </div>
  </section>

  <section id="projects" class="section reveal">
    <div class="section-inner">
      <p class="eyebrow" id="projectsEyebrow"></p>
      <h2 class="section-title" id="projectsTitle"></h2>
      <div class="project-grid" id="projectGrid"></div>
    </div>
  </section>

  <section id="experience" class="section reveal">
    <div class="section-inner narrow">
      <p class="eyebrow" id="experienceEyebrow"></p>
      <h2 class="section-title" id="experienceTitle"></h2>
      <div class="timeline" id="timeline"></div>
    </div>
  </section>

  <section id="skills" class="section reveal">
    <div class="section-inner">
      <p class="eyebrow" id="skillsEyebrow"></p>
      <h2 class="section-title" id="skillsTitle"></h2>
      <div class="skills-grid" id="skillsGrid"></div>
    </div>
  </section>

  <section id="education" class="section reveal">
    <div class="section-inner narrow">
      <p class="eyebrow" id="educationEyebrow"></p>
      <h2 class="section-title" id="educationTitle"></h2>
      <div class="edu-list" id="eduList"></div>
      <div class="cert-row" id="certRow"></div>
    </div>
  </section>

  <section id="beyond" class="section reveal">
    <div class="section-inner narrow">
      <p class="eyebrow" id="beyondEyebrow"></p>
      <h2 class="section-title" id="beyondTitle"></h2>
      <div class="beyond-grid" id="beyondGrid"></div>
    </div>
  </section>

  <section id="contact" class="section reveal contact-section">
    <div class="section-inner narrow center">
      <p class="eyebrow" id="contactEyebrow"></p>
      <h2 class="section-title" id="contactTitle"></h2>
      <p class="contact-sub" id="contactSub"></p>
      <div class="contact-actions" id="contactActions"></div>
    </div>
  </section>

</main>

<footer class="footer">
  <p id="footerText"></p>
</footer>

<div class="lightbox" id="lightbox" aria-hidden="true">
  <button class="lightbox-close" id="lightboxClose" type="button" aria-label="Close">&times;</button>
  <button class="lightbox-nav lightbox-prev" id="lightboxPrev" type="button" aria-label="Previous">&lsaquo;</button>
  <div class="lightbox-stage" id="lightboxStage"></div>
  <button class="lightbox-nav lightbox-next" id="lightboxNext" type="button" aria-label="Next">&rsaquo;</button>
  <div class="lightbox-counter" id="lightboxCounter"></div>
</div>

<script src="script.js"></script>
</body>
</html>
